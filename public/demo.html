<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crew Parcel — Track</title><link rel="stylesheet" href="/assets/tokens.css">
<style>
form{display:flex;gap:var(--s1)}input{flex:1;padding:14px;border:1px solid var(--c-line);border-radius:10px;font-size:16px}
form button{padding:14px 18px;border:0;border-radius:10px;background:var(--c-brand);color:var(--c-brand-ink);font-size:16px;font-weight:600;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s1)}.chip{background:#E8EFF5;color:var(--c-ink);font-size:12px;padding:6px 10px;border-radius:99px;cursor:pointer;border:0}
.hint{font-size:12px;color:var(--c-muted);margin-top:var(--s1)}ul{padding-left:20px}
</style></head><body>
<header><h1>Track your parcel</h1><p>Enter a parcel tracking number or your delivery code.</p></header>
<main>
 <div class="card">
  <form id="f"><input id="code" placeholder="e.g. CRK7M2QX or 1Z999AA1…" autocomplete="off"><button>Track</button></form>
  <div id="second" hidden style="margin-top:8px"><input id="surname" placeholder="Surname on the parcel label" style="width:100%"></div>
  <div class="chips" id="chips"></div>
  <div class="hint">Demo data — tap an example to see each of the 6 scenarios.</div>
 </div>
 <div id="out"></div>
</main>
<script src="/assets/lookup-render.js"></script>
<script>
const examples=[["1 · Here · Paid","1Z999AA10123456784"],["2 · Here · Unpaid (COD)","1ZUNPAID0000001"],["3 · On the way · Paid","TBA123456789"],
 ["4 · On the way · Unpaid","TBAUNPAID000002"],["5 · Here, no order","AMZUNATTACH001"],["6 · No record","NOSUCHCODE123"],["Order code","CRK7M2QX"]];
const $=(id)=>document.getElementById(id);
examples.forEach(([l,c])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=l;b.onclick=()=>{$('code').value=c;go()};$('chips').append(b)});
async function go(){
 const c=$('code').value.trim(); if(!c)return;
 const r=await CrewLookup.fetchLookup(c,$('surname').value.trim());
 $('second').hidden=r.kind!=='needs_second_factor';
 $('out').innerHTML=CrewLookup.render(r);
}
$('f').onsubmit=(e)=>{e.preventDefault();go()};
</script></body></html>
